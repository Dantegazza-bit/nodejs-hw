<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password reset</title>
  </head>
  <body style="font-family: Arial, sans-serif; background: #f6f6f6; padding: 24px">
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
      "
    >
      <tr>
        <td style="padding: 24px">
          <h2 style="margin: 0 0 12px">Hi, {{name}}!</h2>

          <p style="margin: 0 0 16px; line-height: 1.5">
            We received a request to reset your password. Click the button below to set a new
            password.
          </p>

          <p style="margin: 0 0 24px">
            <a
              href="{{link}}"
              style="
                display: inline-block;
                padding: 12px 18px;
                background: #0b5ed7;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
              "
            >
              Reset password
            </a>
          </p>

          <p style="margin: 0; line-height: 1.5; color: #666">
            If you didn’t request a password reset, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
